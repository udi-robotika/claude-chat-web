<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>שיחות WhatsApp</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; max-width: 1100px; margin: 30px auto; padding: 0 16px; color: #222; background: #f7f7f7; }
    h1 { font-size: 24px; }
    form, #toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 18px; }
    input, textarea, button { font: inherit; padding: 9px 11px; }
    button { cursor: pointer; }
    button:disabled { cursor: wait; opacity: .65; }
    #status { margin: 12px 0; min-height: 20px; }
    .conversation { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 14px; margin: 12px 0; box-shadow: 0 2px 7px rgba(0,0,0,.04); }
    .meta { color: #666; font-size: 14px; margin-bottom: 10px; }
    .message { white-space: pre-wrap; margin: 7px 0; }
    .label { font-weight: bold; }
    .reply-form { display: flex; align-items: stretch; gap: 8px; margin: 14px 0 0; }
    .reply-form textarea { flex: 1; min-height: 44px; max-height: 140px; resize: vertical; border: 1px solid #bbb; border-radius: 7px; }
    .reply-form button { min-width: 120px; border: 0; border-radius: 7px; background: #087f5b; color: #fff; font-weight: 700; }
    .reply-result { margin-top: 8px; font-size: 14px; min-height: 18px; }
    .reply-result.success { color: #087f5b; }
    .reply-result.error { color: #b42318; }
    [hidden] { display: none !important; }
    @media (max-width: 650px) {
      body { margin-top: 16px; }
      .reply-form { flex-direction: column; }
      .reply-form button { min-height: 44px; }
    }
  </style>
</head>
<body>
  <h1>שיחות WhatsApp</h1>

  <form id="login">
    <input id="password" type="password" placeholder="סיסמת כניסה" autocomplete="current-password" required>
    <button type="submit">כניסה</button>
  </form>

  <div id="panel" hidden>
    <div id="toolbar">
      <button id="refresh" type="button">רענון</button>
      <span>מוצגות עד 100 השיחות האחרונות</span>
    </div>
    <div id="conversations"></div>
  </div>

  <div id="status"></div>

  <script>
    const login = document.getElementById('login');
    const passwordInput = document.getElementById('password');
    const panel = document.getElementById('panel');
    const status = document.getElementById('status');
    const conversations = document.getElementById('conversations');
    const refresh = document.getElementById('refresh');
    let password = '';

    function addLine(parent, label, value) {
      const line = document.createElement('div');
      line.className = 'message';

      const strong = document.createElement('span');
      strong.className = 'label';
      strong.textContent = label + ': ';

      line.appendChild(strong);
      line.appendChild(document.createTextNode(value || '—'));
      parent.appendChild(line);
    }

    function createReplyForm(item) {
      const wrapper = document.createElement('div');
      const form = document.createElement('form');
      form.className = 'reply-form';

      const textarea = document.createElement('textarea');
      textarea.placeholder = 'כתוב תשובה ידנית ללקוח...';
      textarea.maxLength = 4096;
      textarea.required = true;

      const button = document.createElement('button');
      button.type = 'submit';
      button.textContent = 'שלח ללקוח';

      const result = document.createElement('div');
      result.className = 'reply-result';

      form.append(textarea, button);
      wrapper.append(form, result);

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const text = textarea.value.trim();
        if (!text) return;

        button.disabled = true;
        button.textContent = 'שולח...';
        result.className = 'reply-result';
        result.textContent = '';

        try {
          const response = await fetch('/api/send-whatsapp', {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              'x-admin-password': password
            },
            body: JSON.stringify({ phone: item.phone, text })
          });

          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(data.error || 'השליחה נכשלה');
          }

          textarea.value = '';
          result.className = 'reply-result success';
          result.textContent = 'ההודעה נשלחה ללקוח.';
          setTimeout(loadMessages, 700);
        } catch (error) {
          result.className = 'reply-result error';
          result.textContent = error.message.includes('24')
            ? 'חלון 24 השעות נסגר. צריך לשלוח תבנית WhatsApp מאושרת.'
            : error.message;
        } finally {
          button.disabled = false;
          button.textContent = 'שלח ללקוח';
        }
      });

      textarea.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          form.requestSubmit();
        }
      });

      return wrapper;
    }

    function render(items) {
      conversations.replaceChildren();

      if (!items.length) {
        conversations.textContent = 'אין עדיין שיחות שמורות. שלח הודעת בדיקה לבוט ואז לחץ רענון.';
        return;
      }

      for (const item of items) {
        const card = document.createElement('article');
        card.className = 'conversation';

        const meta = document.createElement('div');
        meta.className = 'meta';
        const parsedTime = new Date(item.time);
        const time = Number.isNaN(parsedTime.getTime())
          ? (item.time || '—')
          : parsedTime.toLocaleString('he-IL');
        const customer = item.name ? item.name + ' · ' + item.phone : item.phone;
        meta.textContent = customer + ' · ' + time;
        card.appendChild(meta);

        addLine(card, 'הלקוח כתב', item.customerMessage);
        addLine(card, item.botReply?.startsWith('👤 מענה ידני:') ? 'נשלח ידנית' : 'הבוט ענה', item.botReply);
        if (item.phone) card.appendChild(createReplyForm(item));
        conversations.appendChild(card);
      }
    }

    async function loadMessages() {
      status.textContent = 'טוען...';

      try {
        const response = await fetch('/api/whatsapp-webhook?admin=messages', {
          headers: { 'x-admin-password': password },
          cache: 'no-store'
        });

        if (response.status === 401) {
          throw new Error('הסיסמה אינה נכונה');
        }
        if (!response.ok) {
          throw new Error('לא ניתן לטעון את השיחות כרגע');
        }

        const data = await response.json();
        render(data.conversations || []);
        login.hidden = true;
        panel.hidden = false;
        status.textContent = '';
      } catch (error) {
        status.textContent = error.message;
      }
    }

    login.addEventListener('submit', async (event) => {
      event.preventDefault();
      password = passwordInput.value;
      await loadMessages();
    });

    refresh.addEventListener('click', loadMessages);
  </script>
</body>
</html>
