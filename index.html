<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>צ'אט עם קלוד</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    background: #f5f4f0;
    color: #2b2b2b;
    height: 100vh;
    display: flex;
    justify-content: center;
  }
  #app {
    width: 100%;
    max-width: 720px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #ffffff;
    box-shadow: 0 0 20px rgba(0,0,0,0.05);
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid #eee;
    font-weight: 600;
    font-size: 18px;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: #d97757;
    color: white;
    border-bottom-left-radius: 4px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: #f0efe9;
    color: #2b2b2b;
    border-bottom-right-radius: 4px;
  }
  .msg.error {
    align-self: center;
    background: #ffe2e2;
    color: #a33;
    font-size: 14px;
  }
  .msg.thinking {
    align-self: flex-start;
    background: #f0efe9;
    color: #888;
    font-style: italic;
  }
  #inputBar {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    border-top: 1px solid #eee;
  }
  #inputBar textarea {
    flex: 1;
    resize: none;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 15px;
    font-family: inherit;
    max-height: 120px;
  }
  #inputBar button {
    background: #d97757;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    font-size: 15px;
    cursor: pointer;
  }
  #inputBar button:disabled {
    background: #ccc;
    cursor: default;
  }
</style>
</head>
<body>
<div id="app">
  <header>צ'אט עם קלוד</header>
  <div id="messages"></div>
  <div id="inputBar">
    <textarea id="input" rows="1" placeholder="כתוב הודעה..."></textarea>
    <button id="sendBtn">שלח</button>
  </div>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');

  // היסטוריית השיחה נשמרת בזיכרון בלבד (נמחקת ברענון הדף)
  let history = [];

  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    sendBtn.disabled = true;
    addMessage('user', text);
    history.push({ role: 'user', content: text });

    const thinkingEl = addMessage('thinking', 'קלוד חושב...');

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ messages: history }),
      });

      const data = await res.json();
      thinkingEl.remove();

      if (!res.ok) {
        addMessage('error', 'שגיאה: ' + (data.error?.message || data.error || 'משהו השתבש'));
      } else {
        addMessage('assistant', data.text);
        history.push({ role: 'assistant', content: data.text });
      }
    } catch (err) {
      thinkingEl.remove();
      addMessage('error', 'שגיאת רשת: ' + err.message);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });
</script>
</body>
</html>
